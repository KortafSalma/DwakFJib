version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: dwafjibk_postgres
    environment:
      POSTGRES_DB: dwafjibk
      POSTGRES_USER: dwafjibk_user
      POSTGRES_PASSWORD: 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dwafjibk_network

  redis:
    image: redis:7-alpine
    container_name: dwafjibk_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dwafjibk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dwafjibk_backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dwafjibk
      DB_USERNAME: dwafjibk_user
      DB_PASSWORD: 
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - dwafjibk_network
    command: bash -c "composer install && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dwafjibk_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dwafjibk_network

networks:
  dwafjibk_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
